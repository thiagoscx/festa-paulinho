<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paulinho 60</title>
<style>body{margin:0;background:#120E0A;color:#F6F0E4;font:18px/1.4 -apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
h1{font-size:44px;margin:0 0 8px}h1 span{color:#F2B33D}p{color:#B3A793;margin:6px 0}a{color:#F2B33D;display:block;margin-top:10px}</style></head>
<body><div><h1>Paulinho <span>60</span></h1><p id="m">Abrindo o DJ...</p><div id="h" style="display:none"><p>Não abriu? Tenta por aqui:</p><a id="l1" href="#">pela internet</a><a id="l2" href="#">pelo Wi-Fi da festa (TMG Plan B)</a></div></div>
<script>
(async()=>{try{const r=await fetch("./ip.json?"+Date.now(),{cache:"no-store"});const d=await r.json();
 const local=`http://${d.ip}:${d.port||4060}/pedir`, net=d.tunel?`${d.tunel}/pedir`:null;
 document.getElementById("l1").href=net||local;document.getElementById("l2").href=local;if(!net)document.getElementById("l1").style.display="none";
 location.replace(net||local);
 setTimeout(()=>{document.getElementById("m").textContent="Hmm, demorou.";document.getElementById("h").style.display="block"},5000);
}catch(e){document.getElementById("m").textContent="O DJ ainda não ligou o som.";document.getElementById("h").style.display="block"}})();
</script></body></html>
